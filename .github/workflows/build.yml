name: Build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm --prefix scripts install --ignore-scripts --no-audit --no-fund
      - run: npm --prefix scripts run build
      - run: node --check src/bootstrap.js && node --check src/core.js && node --check src/core-legacy.js
      - run: node tests/layout.cjs
      - run: git diff --exit-code -- src/core-legacy.js tests/harness/run-legacy.js updates.json dist
      - uses: actions/upload-artifact@v4
        with:
          name: tab-manager
          path: dist/*

