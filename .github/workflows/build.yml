name: Build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build.py
      - run: node --check src/bootstrap.js && node --check src/core.js && node --check src/features.js && node --check tests/compat-harness.js
      - run: node tests/layout.cjs
      - run: node tests/features.cjs
      - run: python tests/package.py
      - run: git diff --exit-code -- updates.json dist
      - uses: actions/upload-artifact@v4
        with:
          name: tab-manager
          path: dist/*

