<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="420" viewBox="0 0 1120 420" role="img" aria-labelledby="title desc">
<title id="title">Tab Manager：让打开的文献井井有条</title>
<desc id="desc">功能示意：分组与文献标签在同一行。彩色研究分组、文献备注、折叠组，右侧有搜索和建议关闭入口。</desc>
<rect width="1120" height="420" rx="24" fill="#f2f4fc"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif">
<text x="54" y="48" fill="#6366a5" font-size="12" font-weight="700" letter-spacing="2">TAB MANAGER / READING, ORGANIZED</text>
<text x="54" y="91" fill="#283450" font-size="30" font-weight="700">每篇文献，都有自己的位置。</text>
<text x="54" y="120" fill="#68758b" font-size="15">按主题收拢标签，用备注留下线索，继续上次的阅读。</text>
<rect x="40" y="150" width="1040" height="115" rx="14" fill="#fff" stroke="#e1e5ee"/>
<path d="M40 200H1080" stroke="#e7eaf1"/>
<text x="61" y="181" fill="#8590a1" font-size="12">文献库</text>
<rect x="129" y="162" width="124" height="27" rx="7" fill="#eeebff"/>
<text x="141" y="181" fill="#6b57c8" font-size="12" font-weight="600">▾ 器件研究 · 3</text>
<rect x="261" y="161" width="155" height="30" rx="6" fill="#f8f7ff" stroke="#c9bdf2"/>
<text x="273" y="181" fill="#4e456d" font-size="12">重点看实验　　×</text>
<text x="432" y="181" fill="#6a7183" font-size="12">这篇有代码　 ×</text>
<path d="M264 196H546" stroke="#9b87e3" stroke-width="3" stroke-linecap="round"/>
<rect x="562" y="162" width="131" height="27" rx="7" fill="#e0f3ee"/>
<text x="574" y="181" fill="#248570" font-size="12" font-weight="600">▸ 方法对比 · 8</text>
<rect x="704" y="162" width="111" height="27" rx="7" fill="#f1f3f6"/>
<text x="716" y="181" fill="#737e8e" font-size="12">▸ 未分组 · 4</text>
<text x="834" y="182" fill="#8c94a4" font-size="20">+</text>
<path d="M874 164V188" stroke="#e1e5ee"/>
<g stroke="#7064ba" stroke-width="1.8" fill="none"><circle cx="900" cy="173" r="6"/><path d="m905 178 5 5"/></g>
<text x="920" y="181" fill="#5e6780" font-size="12">搜索</text>
<g stroke="#6e7b91" stroke-width="1.6" fill="none"><circle cx="980" cy="175" r="8"/><path d="M980 170V175L984 177"/></g>
<text x="997" y="181" fill="#5e6780" font-size="12">建议关闭</text>
<text x="62" y="229" fill="#626d82" font-size="13">当前阅读：重点看实验</text>
<text x="62" y="249" fill="#9aa3b2" font-size="11">Zhang et al. · Hybrid gate p-GaN power HEMT</text>
<rect x="877" y="218" width="182" height="26" rx="13" fill="#f5f6fa"/>
<text x="895" y="235" fill="#8490a3" font-size="11">同一行分组 · 随时折叠展开</text>
<rect x="40" y="285" width="336" height="100" rx="12" fill="#fff" fill-opacity=".78"/>
<circle cx="67" cy="313" r="5" fill="#9b87e3"/>
<text x="82" y="319" fill="#38445e" font-size="15" font-weight="700">按主题分组</text>
<text x="60" y="345" fill="#758097" font-size="13">拖动归组，自定义颜色。</text>
<text x="60" y="366" fill="#758097" font-size="13">暂时不看的，折叠收好。</text>
<rect x="392" y="285" width="336" height="100" rx="12" fill="#fff" fill-opacity=".78"/>
<circle cx="419" cy="313" r="5" fill="#51ab96"/>
<text x="434" y="319" fill="#38445e" font-size="15" font-weight="700">用自己的话标记</text>
<text x="412" y="345" fill="#758097" font-size="13">“重点看实验”“这篇有代码”。</text>
<text x="412" y="366" fill="#758097" font-size="13">不再忘记为什么打开它。</text>
<rect x="744" y="285" width="336" height="100" rx="12" fill="#fff" fill-opacity=".78"/>
<circle cx="771" cy="313" r="5" fill="#dfac59"/>
<text x="786" y="319" fill="#38445e" font-size="15" font-weight="700">快速找回阅读线索</text>
<text x="764" y="345" fill="#758097" font-size="13">搜索备注、文件名或原标题。</text>
<text x="764" y="366" fill="#758097" font-size="13">折叠组里的文献也能找到。</text>
<text x="1080" y="406" text-anchor="end" fill="#96a0b4" font-size="10">功能示意 · 非实际界面截图</text>
</g></svg>
